[package]
name = "rust-image-ffi"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
authors = ["einhornimmond <info@einhornimmond.de>"]
description = "image-rs behind a C interface: decode an untrusted picture under hard limits and encode it again, so that nothing but pixels gets through"
license = "Apache-2.0"
repository = "https://github.com/gradido/rust-image-ffi"
publish = false

[lib]
name = "rust_image_ffi"
# staticlib is what gets localized into rust_image_ffi.o (scripts/localize.sh), cdylib is for
# callers that prefer a shared library, rlib is what the Rust tests link.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Pinned exactly: the decoders are the attack surface of this module, so a version is raised
# deliberately, with the tests green -- never by a lockfile update. Only the formats the header
# names are compiled in; every further decoder is more code that reads hostile bytes.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# The JPEG encoder: mozjpeg, Mozilla's fork of libjpeg-turbo, in C, through its Rust wrapper. Used
# as libjpeg-turbo would behave (see src/reencode.rs). An encoder only ever sees pixels, so the C
# is not part of what reads hostile bytes. Without the default features: they want nasm for the
# SIMD code, and encoding is not what takes the time here.
mozjpeg = { version = "=0.10.13", default-features = false }

[profile.release]
# As in libp2p-ffi. panic must stay "unwind": a panic has to come back through the boundary as
# RIMG_ERR_PANIC, not end the host.
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "unwind"
strip = true

[profile.test]
# The decoders are slow enough unoptimized that the limit tests would crawl.
opt-level = 1
